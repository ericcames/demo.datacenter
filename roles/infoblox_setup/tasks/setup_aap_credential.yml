---
# Setup AAP/AWX Infoblox credential

- name: Test AAP connectivity
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/v2/ping/"
    method: GET
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    status_code: 200
  register: aap_connectivity
  changed_when: false
  tags: [aap, test]

- name: Display AAP connectivity result
  ansible.builtin.debug:
    msg: "AAP/AWX connectivity: {{ 'Success' if aap_connectivity.status == 200 else 'Failed' }}"
  tags: [aap, test]

- name: Get Infoblox credential type ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/v2/credential_types/"
    method: GET
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    status_code: 200
  register: credential_types
  changed_when: false
  tags: [aap, credential]

- name: Find Network credential type
  ansible.builtin.set_fact:
    network_credential_type_id: "{{ credential_types.json.results | selectattr('name', 'equalto', 'Network') | map(attribute='id') | first }}"
  tags: [aap, credential]

- name: Get organization ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/v2/organizations/"
    method: GET
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    status_code: 200
    body_format: json
  register: organizations
  changed_when: false
  tags: [aap, credential]

- name: Find organization ID
  ansible.builtin.set_fact:
    aap_organization_id: "{{ organizations.json.results | selectattr('name', 'equalto', aap_infoblox_organization) | map(attribute='id') | first }}"
  tags: [aap, credential]

- name: Check if Infoblox credential already exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/v2/credentials/?name={{ aap_infoblox_credential_name | urlencode }}"
    method: GET
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    status_code: 200
  register: existing_credential
  changed_when: false
  tags: [aap, credential]

- name: Create Infoblox credential in AAP
  awx.awx.credential:
    name: "{{ aap_infoblox_credential_name }}"
    description: "{{ aap_infoblox_credential_description }}"
    organization: "{{ aap_infoblox_organization }}"
    credential_type: "Network"
    state: present
    inputs:
      host: "{{ aap_infoblox_host }}"
      username: "{{ aap_infoblox_username }}"
      password: "{{ aap_infoblox_password }}"
    controller_host: "{{ aap_host }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: "{{ aap_validate_certs }}"
  when: existing_credential.json.count == 0
  register: credential_creation
  no_log: true
  tags: [aap, credential]

- name: Update existing Infoblox credential in AAP
  awx.awx.credential:
    name: "{{ aap_infoblox_credential_name }}"
    description: "{{ aap_infoblox_credential_description }}"
    organization: "{{ aap_infoblox_organization }}"
    credential_type: "Network"
    state: present
    inputs:
      host: "{{ aap_infoblox_host }}"
      username: "{{ aap_infoblox_username }}"
      password: "{{ aap_infoblox_password }}"
    controller_host: "{{ aap_host }}"
    controller_username: "{{ aap_username }}"
    controller_password: "{{ aap_password }}"
    validate_certs: "{{ aap_validate_certs }}"
  when: existing_credential.json.count > 0
  register: credential_update
  no_log: true
  tags: [aap, credential]

- name: Display credential creation result
  ansible.builtin.debug:
    msg: "AAP Infoblox credential '{{ aap_infoblox_credential_name }}' {{ 'created' if credential_creation is changed else 'updated' if credential_update is changed else 'already exists' }}"
  tags: [aap, credential]

- name: Verify credential in AAP
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/v2/credentials/?name={{ aap_infoblox_credential_name | urlencode }}"
    method: GET
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_validate_certs }}"
    status_code: 200
  register: verify_credential
  changed_when: false
  failed_when: verify_credential.json.count == 0
  tags: [aap, verify]

- name: Display AAP credential details
  ansible.builtin.debug:
    msg:
      - "AAP Infoblox Credential Created:"
      - "  Name: {{ aap_infoblox_credential_name }}"
      - "  Organization: {{ aap_infoblox_organization }}"
      - "  Type: Network"
      - "  Host: {{ aap_infoblox_host }}"
      - "  Username: {{ aap_infoblox_username }}"
      - "  ID: {{ verify_credential.json.results[0].id }}"
  tags: [aap]
