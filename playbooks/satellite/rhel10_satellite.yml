---
# Example: Register RHEL 10 Satellite Server to Red Hat CDN

- name: Register RHEL 10 Satellite Server
  hosts: satellite_servers
  become: true
  gather_facts: true

  vars:
    # Authentication
    rhc_auth_activation_key: "satellite-rhel10-key"
    rhc_organization: "1234567"
    
    # Enable Satellite repositories for RHEL 10
    rhc_enable_satellite_repos: true
    rhc_satellite_version: "6.15"
    
    # Insights configuration
    rhc_insights_state: present
    rhc_insights_autoupdate: true
    rhc_insights_remediation: present
    rhc_insights_display_name: "{{ inventory_hostname }}-rhel10"
    rhc_insights_tags:
      datacenter: dc1
      role: satellite
      environment: production
      rhel_version: "10"

  pre_tasks:
    - name: Verify RHEL 10
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version == "10"
        fail_msg: "This playbook is for RHEL 10 only"
        success_msg: "Running on RHEL 10"

    - name: Display RHEL 10 information
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "RHEL 10 Satellite Server Registration"
          - "==============================================="
          - "  Host: {{ ansible_fqdn }}"
          - "  RHEL Version: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "  Architecture: {{ ansible_architecture }}"
          - "  Satellite Version: {{ rhc_satellite_version }}"
          - "==============================================="

  roles:
    - role: satellite_rhc_management
      tags: [create]

  post_tasks:
    - name: Verify RHEL 10 repositories
      ansible.builtin.command: subscription-manager repos --list-enabled
      register: enabled_repos
      changed_when: false
      tags: [create]

    - name: Check for RHEL 10 specific repos
      ansible.builtin.assert:
        that:
          - "'rhel-10-for-x86_64-baseos-rpms' in enabled_repos.stdout"
          - "'rhel-10-for-x86_64-appstream-rpms' in enabled_repos.stdout"
          - "'satellite-' + rhc_satellite_version + '-for-rhel-10' in enabled_repos.stdout"
        fail_msg: "RHEL 10 Satellite repositories not properly enabled"
        success_msg: "RHEL 10 Satellite repositories verified"
      tags: [create]

    - name: Display RHEL 10 repositories
      ansible.builtin.debug:
        msg: "{{ enabled_repos.stdout_lines | select('search', 'rhel-10\\|satellite.*rhel-10') | list }}"
      tags: [create]

    - name: RHEL 10 specific next steps
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "RHEL 10 Registration Complete!"
          - "==============================================="
          - ""
          - "RHEL 10 Repositories Enabled:"
          - "  ✓ rhel-10-for-x86_64-baseos-rpms"
          - "  ✓ rhel-10-for-x86_64-appstream-rpms"
          - "  ✓ satellite-6.15-for-rhel-10-x86_64-rpms"
          - "  ✓ satellite-maintenance-6.15-for-rhel-10-x86_64-rpms"
          - ""
          - "Next Steps:"
          - "  1. Update system: sudo dnf update -y"
          - "  2. Install Satellite: sudo dnf install satellite -y"
          - "  3. Configure Satellite"
          - ""
          - "Note: RHEL 10 is the latest major version"
          - "      Ensure Satellite 6.15 supports RHEL 10"
          - ""
          - "==============================================="
      tags: [create]
