---
# Unified Satellite Registration Management Playbook
# Use tags to control registration (create) or unregistration (remove)

- name: Manage Satellite Server Registration
  hosts: satellite_servers
  become: true
  gather_facts: true

  vars:
    # ===========================================================================
    # AUTHENTICATION (Required for registration - 'create' tag)
    # ===========================================================================
    # Method 1: Activation key (recommended)
    rhc_auth_activation_key: "satellite-prod-key"
    rhc_organization: "1234567"
    
    # Method 2: Username/password (use Ansible Vault)
    # rhc_auth_username: "{{ vault_rhc_username }}"
    # rhc_auth_password: "{{ vault_rhc_password }}"
    # rhc_organization: "1234567"
    
    # ===========================================================================
    # REGISTRATION CONFIGURATION
    # ===========================================================================
    # Enable Satellite repositories
    rhc_enable_satellite_repos: true
    rhc_satellite_version: "6.15"
    
    # Insights configuration
    rhc_insights_state: present
    rhc_insights_autoupdate: true
    rhc_insights_remediation: present
    rhc_insights_display_name: "{{ inventory_hostname }}"
    rhc_insights_tags:
      datacenter: dc1
      role: satellite
      environment: production
      managed_by: ansible
    
    # Optional: Proxy configuration
    # rhc_proxy_hostname: "proxy.dc1.example.com"
    # rhc_proxy_port: "3128"
    # rhc_proxy_username: "{{ vault_proxy_user }}"
    # rhc_proxy_password: "{{ vault_proxy_password }}"
    
    # Optional: Release lock
    # rhc_release_lock: "8.9"

  pre_tasks:
    - name: Display playbook information
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "Satellite Registration Management"
          - "==============================================="
          - "  Host: {{ ansible_fqdn }}"
          - "  RHEL Version: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "  Tags: {{ ansible_run_tags | default(['all']) | join(', ') }}"
          - "==============================================="
          - ""
          - "Usage:"
          - "  Register:   ansible-playbook playbook.yml --tags create"
          - "  Unregister: ansible-playbook playbook.yml --tags remove"
          - "==============================================="
      tags: [always]

    - name: Verify system requirements (for registration)
      ansible.builtin.assert:
        that:
          - ansible_distribution == "RedHat"
          - ansible_distribution_major_version | int >= 8
          - ansible_memtotal_mb >= 20480  # 20GB RAM for Satellite
          - ansible_processor_vcpus >= 4
        fail_msg: "System does not meet Satellite minimum requirements"
        success_msg: "System meets Satellite requirements"
      tags: [create, never]

  roles:
    - satellite_rhc_management

  post_tasks:
    # Post-registration tasks (create tag)
    - name: Pause for subscription propagation
      ansible.builtin.pause:
        seconds: 5
      tags: [create, never]

    - name: Run subscription-manager refresh
      ansible.builtin.command: subscription-manager refresh
      changed_when: true
      tags: [create, never]

    - name: Get final subscription status
      ansible.builtin.command: subscription-manager status
      register: final_status
      changed_when: false
      tags: [create, never]

    - name: Display final status
      ansible.builtin.debug:
        msg: "{{ final_status.stdout_lines }}"
      tags: [create, never]

    - name: Display next steps for Satellite installation
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "Registration Complete!"
          - "==============================================="
          - ""
          - "Next steps for Satellite installation:"
          - ""
          - "1. Update all packages:"
          - "   sudo dnf update -y"
          - ""
          - "2. Reboot if kernel was updated:"
          - "   sudo reboot"
          - ""
          - "3. Install Satellite:"
          - "   sudo dnf install satellite -y"
          - ""
          - "4. Run Satellite installer:"
          - "   sudo satellite-installer --scenario satellite \\"
          - "     --foreman-initial-admin-username admin \\"
          - "     --foreman-initial-admin-password 'ChangeMe123!'"
          - ""
          - "5. Access Satellite web UI:"
          - "   https://{{ ansible_fqdn }}"
          - ""
          - "==============================================="
      tags: [create, never]

    # Post-unregistration tasks (remove tag)
    - name: Display unregistration completion
      ansible.builtin.debug:
        msg:
          - "==============================================="
          - "Unregistration Complete!"
          - "==============================================="
          - ""
          - "  System {{ ansible_fqdn }} has been:"
          - "    ✓ Unregistered from Red Hat Subscription Management"
          - "    ✓ Disconnected from Red Hat Insights"
          - "    ✓ Local subscription data cleaned"
          - ""
          - "  The system can be re-registered at any time with:"
          - "    ansible-playbook playbook.yml --tags create"
          - ""
          - "==============================================="
      tags: [remove, never]
