---
- name: Provision demo datacenter
  hosts: localhost
  connection: local

  tasks:

    - name: Grab vault from remote url
      tags:
        - create
      ansible.builtin.get_url:
        url: '{{ my_remote_vault }}'
        dest: remotevault.yml
        mode: '0644'


    - name: Include the infrastructure role
      tags:
        - create
      ansible.builtin.include_role:
        name: infrastructure

    - name: Include the infrastructure role
      tags:
        - remove
      ansible.builtin.include_role:
        name: infrastructure
