---
- name: Register Satellite server with redhat
  hosts: satellite

  tasks:

    - name: Gitty up
      tags:
        - create
      block:

        - name: Get our remote vaulted variables
          ansible.builtin.include_role:
            name: remote_vault

        - name: Include the redhat subscription manager role
          ansible.builtin.include_role:
            name: rhsm

        - name: Run the Linux post install
          ansible.builtin.include_role:
            name: linux_post_install

        - name: Run the Satellite install
          ansible.builtin.include_role:
            name: satellite
